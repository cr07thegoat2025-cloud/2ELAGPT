<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f0df"><title>BIKCHU — Owner dashboard</title><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f0df;--cream:#fffaf0;--ink:#302d27;--muted:#777064;--green:#55745b;--line:#d8cfbb}*{box-sizing:border-box}body{margin:0;background:var(--paper);background-image:radial-gradient(#d8cfbb .8px,transparent .8px);background-size:18px 18px;color:var(--ink);font:22px "VT323",monospace}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}header{padding:25px 0;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font:10px/1.9 "Press Start 2P"}.brand span{color:var(--green)}h1{font:15px/1.8 "Press Start 2P"}h2{font:11px/1.8 "Press Start 2P"}.panel,.request{background:var(--cream);border:2px solid var(--ink);padding:20px;margin:18px 0;box-shadow:4px 4px var(--line)}input,textarea,select{width:100%;padding:12px;border:2px solid var(--line);background:white;font:21px "VT323";margin:6px 0 12px}.btn{padding:12px 16px;background:var(--green);color:white;border:2px solid var(--ink);font:9px "Press Start 2P";cursor:pointer;box-shadow:3px 3px var(--ink)}.btn:disabled{opacity:.5}.muted{color:var(--muted)}.status{color:var(--green);min-height:24px}.request h3{font:10px/1.8 "Press Start 2P"}.meta{color:var(--muted);font-size:18px}.idea{white-space:pre-wrap;line-height:1.2}.brief{white-space:pre-wrap;background:#f3f0e6;padding:15px;border:1px dashed var(--line);line-height:1.2}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:var(--sage,#dce8d7);padding:4px 9px}.hidden{display:none!important}a{color:var(--green)}</style></head>
<body><header class="wrap"><div class="brand">BIKCHU <span>OWNER</span><br>DASHBOARD</div><a href="./">← Public website</a></header><main class="wrap"><h1>PRIVATE PROJECT INBOX</h1><section class="panel" id="loginPanel"><p>Sign in to review client requests. This area is private.</p><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your Vercel ADMIN_PASSWORD"><button class="btn" id="login">UNLOCK DASHBOARD</button><p class="status" id="loginStatus" role="status"></p></section>
<section id="app" class="hidden"><div class="row"><h2>INCOMING REQUESTS</h2><button class="btn" id="refresh">REFRESH</button><button class="btn" id="logout">LOG OUT</button></div><p class="status" id="appStatus"></p><div id="requests"></div></section></main>
<script>
let token="";
const $=id=>document.getElementById(id);
async function load(){ $("appStatus").textContent="Loading requests…";const r=await fetch("/api/admin/requests",{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to load inbox.");$("requests").innerHTML="";if(!d.requests.length){$("appStatus").textContent="No project requests yet.";return;}
$("appStatus").textContent=d.requests.length+" recent request(s).";
for(const item of d.requests){const el=document.createElement("article");el.className="request";const title=document.createElement("h3");title.textContent="#"+item.id+" — "+item.name;const meta=document.createElement("p");meta.className="meta";meta.textContent=item.email+" · "+item.package+" · "+new Date(item.created_at).toLocaleString();const idea=document.createElement("p");idea.className="idea";idea.textContent=item.idea;const budget=document.createElement("p");budget.className="meta";budget.textContent="Budget: "+(item.budget||"Not provided")+" · Status: "+item.status;const button=document.createElement("button");button.className="btn";button.textContent="GENERATE AI PROJECT BRIEF";const output=document.createElement("div");output.className="brief";output.textContent=item.ai_brief||"No AI brief generated yet.";if(!item.ai_brief)output.classList.add("hidden");button.addEventListener("click",async()=>{button.disabled=true;button.textContent="THINKING…";output.classList.remove("hidden");output.textContent="Preparing a draft brief…";try{const response=await fetch("/api/admin/brief",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({id:item.id})});const result=await response.json();if(!response.ok)throw new Error(result.error||"AI request failed.");output.textContent=result.brief;}catch(e){output.textContent=e.message;}finally{button.disabled=false;button.textContent="GENERATE AI PROJECT BRIEF";}});el.append(title,meta,idea,budget,button,output);$("requests").append(el);}
}
$("login").addEventListener("click",async()=>{token=$("password").value;if(!token){$("loginStatus").textContent="Enter your admin password.";return;}try{await load();$("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");}catch(e){token="";$("loginStatus").textContent=e.message;}});
$("refresh").addEventListener("click",()=>load().catch(e=>$("appStatus").textContent=e.message));
$("logout").addEventListener("click",()=>{token="";$("password").value="";$("app").classList.add("hidden");$("loginPanel").classList.remove("hidden");$("requests").replaceChildren();});
</script></body></html>
